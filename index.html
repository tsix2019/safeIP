<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://ipservice.ws.126.net https://whois.pconline.com.cn https://vv.video.qq.com https://opendata.baidu.com; style-src 'self'; connect-src https: http://ip-api.com; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
  <title>SafeIP · 全球 IP 分流检测</title>
  <meta name="description" content="一站式 IP 检测工具箱：国内外多源 IP、分流测试、AI 服务地区、IP 评分、WebRTC / DNS 泄露、全球 Ping、浏览器指纹、Whois。纯前端，无后端。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.2'/%3E%3Cpath d='M7 16h18M16 7c-3.6 4-3.6 14 0 18M16 7c3.6 4 3.6 14 0 18' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <!--
    脚本全部 defer 并放在 head：上面的 CSP meta 标签会让 Chrome 的预加载扫描器失效，
    放在 body 末尾的普通脚本只能等解析器走到才下载，35 个文件会一个接一个串行下载。
    defer 脚本在这里就被发现并立即并行下载，文档解析完后按顺序执行；
    fetchpriority="high" 让它们与样式表同时下载，不被排进低优先级队列。
    第一个脚本放在样式表之前：部分安全软件会在页面第一个 <script> 前插入同步脚本，
    插在样式表之后时它要等样式表下载完才执行，后面所有脚本的下载都会被推迟一次往返。
  -->
  <script defer fetchpriority="high" src="js/util.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <!-- 数据与逻辑模块 -->
  <script defer fetchpriority="high" src="js/sources.js"></script>
  <script defer fetchpriority="high" src="js/geo.js"></script>
  <script defer fetchpriority="high" src="js/webrtc.js"></script>
  <script defer fetchpriority="high" src="js/dns.js"></script>
  <script defer fetchpriority="high" src="js/connectivity.js"></script>
  <script defer fetchpriority="high" src="js/analyze.js"></script>
  <script defer fetchpriority="high" src="js/risk.js"></script>
  <script defer fetchpriority="high" src="js/whois.js"></script>
  <script defer fetchpriority="high" src="js/gping.js"></script>
  <script defer fetchpriority="high" src="js/svcstatus.js"></script>
  <script defer fetchpriority="high" src="js/fingerprint.js"></script>
  <script defer fetchpriority="high" src="js/china.js"></script>
  <script defer fetchpriority="high" src="js/splittest.js"></script>
  <script defer fetchpriority="high" src="js/ipcard.js"></script>
  <!-- 调度、组件与页面 -->
  <script defer fetchpriority="high" src="js/core.js"></script>
  <script defer fetchpriority="high" src="js/ui.js"></script>
  <script defer fetchpriority="high" src="js/pages/home.js"></script>
  <script defer fetchpriority="high" src="js/pages/lookup.js"></script>
  <script defer fetchpriority="high" src="js/pages/split.js"></script>
  <script defer fetchpriority="high" src="js/pages/ai.js"></script>
  <script defer fetchpriority="high" src="js/pages/risk.js"></script>
  <script defer fetchpriority="high" src="js/pages/conn.js"></script>
  <script defer fetchpriority="high" src="js/pages/dns.js"></script>
  <script defer fetchpriority="high" src="js/pages/webrtc.js"></script>
  <script defer fetchpriority="high" src="js/pages/cloudflare.js"></script>
  <script defer fetchpriority="high" src="js/pages/ping.js"></script>
  <script defer fetchpriority="high" src="js/pages/fingerprint.js"></script>
  <script defer fetchpriority="high" src="js/pages/china.js"></script>
  <script defer fetchpriority="high" src="js/pages/status.js"></script>
  <script defer fetchpriority="high" src="js/pages/whois.js"></script>
  <script defer fetchpriority="high" src="js/pages/asn.js"></script>
  <script defer fetchpriority="high" src="js/pages/card.js"></script>
  <script defer fetchpriority="high" src="js/router.js"></script>
  <script defer fetchpriority="high" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-main">
      <a class="brand" href="#/" aria-label="SafeIP 首页">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="currentColor"/>
          <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2.2"/>
          <path d="M7 16h18M16 7c-3.6 4-3.6 14 0 18M16 7c3.6 4 3.6 14 0 18" fill="none" stroke="#fff" stroke-width="1.6"/>
        </svg>
        <span class="brand-text"><strong>SafeIP</strong><small>全球 IP 分流检测</small></span>
      </a>
      <div class="actions">
        <label class="switch" title="截图分享前打开，全页 IP 打码">
          <input type="checkbox" id="mask">
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-label">隐藏 IP</span>
        </label>
        <button type="button" id="theme" class="icon-btn icon-btn-lg" aria-label="切换主题">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg>
        </button>
        <button type="button" id="copy" class="btn">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>
          <span>复制报告</span>
        </button>
        <button type="button" id="rerun" class="btn btn-primary">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          <span>重新检测</span>
        </button>
      </div>
    </div>
    <nav class="wrap nav" id="nav" aria-label="功能导航"></nav>
    <div class="progress" aria-hidden="true"><i id="progress-bar"></i></div>
  </header>

  <!-- 脚本加载完成、路由挂载页面时替换掉占位 -->
  <main class="wrap" id="view">
    <div class="boot" id="boot" role="status"><span class="st-icon st-muted" aria-hidden="true"></span>正在加载…</div>
    <noscript><div class="boot">SafeIP 需要启用 JavaScript 才能运行。</div></noscript>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p>所有检测请求都由你的浏览器直接发往对应的第三方服务；本工具没有后端，不收集任何数据。</p>
      <p id="proto-note"></p>
      <p><a href="https://github.com/tsix2019/safeIP" target="_blank" rel="noopener">GitHub</a> · MIT License</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
